# Scientific settings; cluster settings belong in .env.
engine: pqn
seeds:
- 0
- 1
- 2
description: 'Craftax-Classic SEE reference recipe (conditional-MI classifier on branched rollouts)'
settings:
  achieved_skill_relabel_effective_beta: 0.99
  achieved_skill_relabel_min_norm: 0.0
  achieved_skill_relabel_min_prob: 0.0
  achieved_skill_relabel_weight_max: 3.0
  achieved_skill_relabel_weight_mode: effective_number
  achieved_skill_relabeling: false
  allow_cpu: false
  checkpoint_every_segments: 77
  continuous_reward_normalization: sampled_infonce
  continuous_reward_temperature: true
  discount: 0.95
  discrete_reward_softmax: true
  discrete_skill_library: axis
  discrete_skills: false
  encoder_batch_size: 4096
  encoder_data_source: branches
  encoder_hidden_dims:
  - 512
  - 512
  encoder_learning_rate: 0.001
  encoder_max_grad_norm: 0.0
  encoder_objective: forward_infonce
  encoder_obs_mode: inventory
  encoder_target_tau: 1.0
  encoder_temperature: 0.1
  environment: craftax:classic-symbolic
  episode_length: 1000
  eval_at_start: true
  eval_contexts: 128
  eval_episode_length: 0
  eval_every_segments: 77
  eval_fixed_reset_seed: 0
  eval_media_interval: 50000000
  eval_media_skill_count: 4
  eval_render_block_pixel_size: agent
  eval_skills_per_context: 1
  eval_video_episodes: 1
  eval_video_frame_skip: 4
  full_state_every_segments: 385
  full_state_include_archive: true
  future_gamma: 0.95
  keep_checkpoints: 0
  log_every_segments: 1
  lr: 0.0003
  max_chunks: 0
  max_future_steps: 0
  max_train_seconds: null
  num_envs: 1024
  num_skills: 16
  optimistic_reset_ratio: 16
  pair_form: difference
  phi_noise_std: 0.0
  phi_norm_cap: 0.0
  potential_lane_fraction: 0.0
  potential_reward_reference: anchor
  potential_reward_scale: 1.0
  potential_skill_samples: 8
  potential_steps: 100
  pqn_context_free_recurrence: false
  # Carry each Q network's LSTM memory across the potential-to-skill switch.
  # see_reset_memory.yaml resets it instead.
  pqn_preserve_memory_at_switch: true
  pqn_epsilon_end: 0.005
  pqn_epsilon_fraction: 0.05
  pqn_epsilon_start: 1.0
  pqn_hidden_size: 512
  pqn_lambda: 0.5
  pqn_lr_linear_decay: true
  pqn_max_grad_norm: 0.5
  pqn_norm_input: true
  pqn_num_epochs: 4
  pqn_num_layers: 1
  pqn_num_minibatches: 4
  pqn_schedule_env_steps: 2000000000
  relabel_encoder: live
  relabel_outcome: discounted
  relabel_samples: 8
  relabel_unit: segment
  representation_archive_size: 10000000
  representation_archive_update_ratio: 0.25
  representation_train_start_rows: 10000
  reward_encoder: live
  reward_partition_anneal_end_steps: 1600000000
  reward_partition_anneal_start_steps: 600000000
  rl_algorithm: potential-pqn
  rollout_steps: 128
  run_dir: artifacts/runs/unassigned
  sample_hindsight_anchors: false
  seed: 0
  separate_skill0_q: true
  skill_dim: 16
  skill_logit_init_std: 0.2
  total_env_steps: 2000000000
